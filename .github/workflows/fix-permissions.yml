name: Fix script permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Remettre le bit executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Marquer les scripts comme executables
        run: |
          set -e
          for f in build.sh rebrand.sh format.sh; do
            if [ -f "$f" ]; then
              git update-index --chmod=+x "$f"
              echo "  +x  $f"
            else
              echo "  absent : $f"
            fi
          done

      - name: Verifier
        run: |
          echo "Modes enregistres dans git :"
          git ls-files -s build.sh rebrand.sh format.sh
          if git ls-files -s build.sh | grep -q '^100755'; then
            echo "build.sh est bien executable."
          else
            echo "::error::build.sh n'est toujours pas executable"; exit 1
          fi

      - name: Commiter
        run: |
          git config user.name "PrimeFreeBird"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Rien a changer, les scripts etaient deja executables."
            exit 0
          fi
          git commit -m "Restore executable bit on shell scripts"
          git push
