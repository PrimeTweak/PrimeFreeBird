name: Rebrand X

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL of an X IPA"
        default: ""
        required: true
        type: string
      twitter_branding:
        description: "Set app name to Twitter"
        default: true
        required: false
        type: boolean
      icon_pack:
        description: "Apply icon pack"
        default: true
        required: false
        type: boolean
      resource_pack_url:
        description: "Other icon pack link (.zip). https://files.catbox.moe/p63f20.zip"
        default: ""
        required: false
        type: string
      commit_id:
        description: "(Optional) Commit ID to run at"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebrand:
    name: Rebrand IPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}

      - name: Download IPA
        id: ipa
        run: |
          IPA_EXT=ipa
          case "${IPA_URL%%\?*}" in *.tipa) IPA_EXT=tipa ;; esac
          echo "ext=${IPA_EXT}" >> "$GITHUB_OUTPUT"
          wget "$IPA_URL" --no-verbose -O "main/packages/X-rebranded.${IPA_EXT}"
        env:
          IPA_URL: ${{ inputs.ipa_url }}

      # The repository's branding/resource-pack.zip, unless another link is given; the
      # default link serves only while the repository has none.
      - name: Prepare Image Pack
        if: inputs.icon_pack
        run: |
          if [ -z "$IMAGE_URL" ] && [ -f main/branding/resource-pack.zip ]; then
            cp main/branding/resource-pack.zip main/resource-pack.zip
            exit 0
          fi
          url="${IMAGE_URL:-$DEFAULT_IMAGE_URL}"
          if ! wget "$url" --no-verbose --tries=4 --waitretry=10 --timeout=20 --retry-connrefused -O main/resource-pack.zip; then
            rm -f main/resource-pack.zip
            echo "::error::Icon pack not downloaded from $url. Untick Apply icon pack to rebrand without it, or add the pack as branding/resource-pack.zip."
            exit 1
          fi
        env:
          IMAGE_URL: ${{ inputs.resource_pack_url }}
          DEFAULT_IMAGE_URL: https://files.catbox.moe/p63f20.zip

      - name: Rebrand IPA
        run: |
          cd ${{ github.workspace }}/main
          IMAGE_FLAG=""
          if [ -f resource-pack.zip ]; then IMAGE_FLAG="--resource-pack resource-pack.zip"; fi
          ./rebrand.sh${{ inputs.twitter_branding && ' --twitter-branding' || '' }} $IMAGE_FLAG \
            "packages/X-rebranded.${{ steps.ipa.outputs.ext }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: X-rebranded
          path: ${{ github.workspace }}/main/packages/X-rebranded.${{ steps.ipa.outputs.ext }}
          archive: false
          if-no-files-found: error
